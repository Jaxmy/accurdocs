[project]
name = "policyrag"
version = "0.4.0"
description = "accurdocs — 政策/金融长文档精准检索与分析 Agent（宁可拒答，不可幻觉）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "anthropic>=0.40",
    "openai>=1.40",
    "zhipuai>=2.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# 3.12 下可用；8GB 内存机器按需安装（fastembed 用 ONNX 跑 bge-small-zh）
embed = [
    "fastembed>=0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
